<div class="page-wrapper auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h2>😂 Create Account</h2>
      <p>Join MoodMeme and start saving your favorite memes</p>
    </div>

    <div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>
    <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

    <form [formGroup]="signupForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Username</label>
        <input class="form-control" formControlName="username" placeholder="Choose a username" />
        <span class="error-msg" *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched">
          Username must be at least 3 characters
        </span>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input class="form-control" type="email" formControlName="email" placeholder="your@email.com" />
        <span class="error-msg" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
          Please enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" formControlName="password" placeholder="Min 6 characters" />
        <span class="error-msg" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
          Password must be at least 6 characters
        </span>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%"
              [disabled]="loading || signupForm.invalid">
        {{ loading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
