<div class="page-wrapper auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h2>😂 Welcome Back</h2>
      <p>Login to access your liked memes and more</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email Address</label>
        <input class="form-control" type="email" formControlName="email"
               placeholder="your@email.com" />
        <span class="error-msg" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" formControlName="password"
               placeholder="Your password" />
        <span class="error-msg" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters
        </span>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%"
              [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a routerLink="/signup">Sign up here</a></p>
  </div>
</div>
